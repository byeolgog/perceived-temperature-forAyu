# GitHub Pages 배포 + 실시간 날씨(안양대 캠퍼스 실측, 기상청 만안구 실황·예보) 매시간 갱신
#
# 설정 (처음 한 번):
#   1) Settings → Secrets and variables → Actions → New repository secret
#      이름: KMA_APIHUB_KEY / 값: 기상청 API허브 인증키
#   2) Settings → Pages → Build and deployment → Source: "GitHub Actions"
# 인증키는 비밀값으로만 쓰이고, 배포되는 파일(docs/campus_now.json, docs/forecast.json)에는 들어가지 않습니다.
# API허브에서 '고해상도 격자자료'와 '단기예보' 둘 다 활용신청되어 있어야 합니다.
name: Pages (캠퍼스 실측 갱신)

on:
  push:
    branches: [main]
  schedule:
    - cron: "43 * * * *"   # 60분마다, 매시 43분 (GitHub schedule이 안 돌면 cron-job.org가 workflow_dispatch로 실행)
  workflow_dispatch:        # Actions 탭에서 수동 실행

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 실시간 날씨 받기 (캠퍼스 실측 + 만안구 예보)
        env:
          KMA_APIHUB_KEY: ${{ secrets.KMA_APIHUB_KEY }}
        run: |
          # 실패하면 지금 공개된 파일을 유지하려고 사이트 주소를 알려 줌
          export PAGES_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          # 새 모델(지연특성·신경망 포함) 계산에 numpy·scikit-learn·joblib 필요
          pip install --quiet requests pandas numpy scikit-learn joblib
          python update_live_weather.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true   # GitHub 쪽 일시 오류("No artifacts named github-pages")가 가끔 남

      - name: 배포 재시도 대기 (90초)
        if: steps.deployment.outcome == 'failure'
        run: sleep 90

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: 배포 재시도 대기 (3분)
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: sleep 180

      - id: deployment_retry2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v4
